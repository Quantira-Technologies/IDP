services:
  backend:
    build: ./backend
    ports:
      - "8020:8020"
    environment:
      EXTRACTOR: ${EXTRACTOR:-mock}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.80}
      DATABASE_URL: sqlite:///./storage/intel2doc.sqlite3
      # Optional hardening — leave unset for open local demos.
      API_KEY: ${API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # AI extraction via Ollama (only used when EXTRACTOR=ollama).
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
    volumes:
      - backend_storage:/app/storage
      - ./assets:/app/assets
    command: uvicorn app.main:app --host 0.0.0.0 --port 8020
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8020/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    ports:
      - "3003:3003"
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-https://idp.quantrexfintech.com}
      VITE_API_KEY: ${API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_storage:
