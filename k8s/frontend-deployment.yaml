apiVersion: apps/v1
kind: Deployment
metadata:
  name: intel2doc-frontend
  namespace: intel2doc

spec:
  replicas: 2

  selector:
    matchLabels:
      app: intel2doc-frontend

  template:
    metadata:
      labels:
        app: intel2doc-frontend

    spec:
      containers:
        - name: frontend

          image: 104680212681.dkr.ecr.ap-south-2.amazonaws.com/intel2doc-frontend:v1

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "250m"
              memory: "256Mi"